services:
  qoder2api:
    image: ${QODER_IMAGE:-ghcr.io/your-org-or-user/qoderapi:latest}
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8963:8963"
    environment:
      QODER_PAT: ${QODER_PAT:?QODER_PAT is required}
      QODER_HOST: 0.0.0.0
      QODER_PORT: 8963
